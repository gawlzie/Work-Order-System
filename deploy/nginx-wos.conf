# nginx site for WOS: passes everything to the app on 127.0.0.1:3000.
# certbot (--nginx --redirect) adds the HTTPS server block and the http -> https redirect to this file.
server {
    listen 80;
    listen [::]:80;
    server_name wos.techz.web.id;

    # Proof photos are up to 10 MB.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
